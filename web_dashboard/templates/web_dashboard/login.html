<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar - NetFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; background: #f6f8fb; display: grid; place-items: center; color: #243142; }
    .login-panel { width: min(420px, calc(100vw - 2rem)); background: #fff; border-radius: .6rem; box-shadow: 0 1px 12px rgba(20, 32, 48, .08); }
    .brand-evolving { color: #8b96a6; font-size: .72rem; margin-left: .35rem; }
  </style>
</head>
<body>
  <main class="login-panel p-4">
    <h1 class="h4 mb-1">NetFlow <span class="brand-evolving">evolving</span></h1>
    <p class="text-secondary mb-4">Ingresá con un usuario administrador para ver el panel.</p>

    {% if form.errors %}
      <div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
        <input class="form-control" type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
        <input class="form-control" type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Ingresar</button>
    </form>
  </main>
</body>
</html>
