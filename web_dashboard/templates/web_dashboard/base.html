<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NetFlow Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { background: #f6f8fb; color: #243142; }
    .app-shell { min-height: 100vh; display: flex; }
    .sidebar { width: 250px; background: #172033; color: #fff; flex-shrink: 0; }
    .sidebar a { color: #d9e4f2; text-decoration: none; display: block; padding: .72rem 1rem; border-radius: .45rem; }
    .sidebar a:hover, .sidebar a.active { background: #243653; color: #fff; }
    .content { flex: 1; min-width: 0; }
    .summary-card { border: 0; border-radius: .5rem; box-shadow: 0 1px 8px rgba(20, 32, 48, .06); }
    .panel { background: #fff; border-radius: .5rem; box-shadow: 0 1px 8px rgba(20, 32, 48, .06); }
    .table th { color: #526173; font-size: .86rem; font-weight: 600; }
    .table td { vertical-align: middle; }
    .muted-label { color: #6b7788; font-size: .85rem; }
    .value-lg { font-size: 1.55rem; font-weight: 700; }
    .chart-box { height: 280px; }
    @media (max-width: 900px) {
      .app-shell { display: block; }
      .sidebar { width: 100%; }
      .sidebar nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: .25rem; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar p-3">
    <h1 class="h5 mb-4">NetFlow</h1>
    <nav>
      <a href="{% url 'dashboard' %}">Resumen</a>
      <a href="{% url 'devices' %}">Dispositivos</a>
      <a href="{% url 'traffic' %}">Tráfico identificado</a>
      <a href="{% url 'dns' %}">DNS</a>
      <a href="{% url 'exports' %}">Exportaciones</a>
    </nav>
  </aside>
  <main class="content p-4">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
