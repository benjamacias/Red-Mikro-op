{% extends "web_dashboard/base.html" %}
{% block title %}Configuracion{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 class="mb-1">Configuracion</h2>
    <div class="muted-label">Parametros operativos del dashboard</div>
  </div>
</div>

<section class="panel p-3 mb-4">
  <h3 class="h5 mb-3">Alertas de subida</h3>
  <form method="post" class="row g-3 align-items-end">
    {% csrf_token %}
    <div class="col-md-4">
      <label class="form-label" for="upload_alert_threshold_mb">MB por hora</label>
      <input class="form-control" id="upload_alert_threshold_mb" name="upload_alert_threshold_mb" type="number" min="1" step="0.01" value="{{ upload_alert_threshold_mb }}">
    </div>
    <div class="col-md-3 d-grid">
      <button class="btn btn-primary" type="submit">Guardar</button>
    </div>
  </form>
</section>
{% endblock %}
